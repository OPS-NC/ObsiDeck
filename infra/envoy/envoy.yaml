# Envoy gateway in front of ObsiDeck.
#
#   Browser ─HTTPS─▶ Tailscale Serve ─HTTP─▶ 127.0.0.1:8088 (this listener, :8080 in the container)
#                                              └─▶ obsideck:3000 (private Docker network)
#
# TLS is terminated by Tailscale: Envoy only speaks plain HTTP.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      per_connection_buffer_limit_bytes: 1048576
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: obsideck
                codec_type: AUTO
                # Tailscale Serve is the only client and already adds X-Forwarded-*.
                # Trust exactly one hop so the real tailnet client IP is kept.
                use_remote_address: true
                xff_num_trusted_hops: 1
                skip_xff_append: false
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                server_header_transformation: PASS_THROUGH
                # Interactive app: short header timeout, long-lived streams allowed (SSE).
                request_headers_timeout: 10s
                stream_idle_timeout: 300s
                common_http_protocol_options:
                  idle_timeout: 3600s
                  headers_with_underscores_action: REJECT_REQUEST
                upgrade_configs:
                  - upgrade_type: websocket
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_SENT%B %DURATION%ms xff=\"%REQ(X-FORWARDED-FOR)%\" proto=%REQ(X-FORWARDED-PROTO)% host=\"%REQ(X-FORWARDED-HOST)%\"\n"
                route_config:
                  name: obsideck
                  # Preserve the original scheme/host set by Tailscale Serve, add them when absent.
                  request_headers_to_add:
                    - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                      append_action: ADD_IF_ABSENT
                  virtual_hosts:
                    - name: obsideck
                      # Host allowlist: blocks DNS-rebinding attempts against the local port.
                      domains:
                        - "*.ts.net"
                        - "*.ts.net:*"
                        - "localhost"
                        - "localhost:*"
                        - "127.0.0.1"
                        - "127.0.0.1:*"
                      routes:
                        - match: { path: "/" }
                          redirect: { path_redirect: "/obsideck", response_code: FOUND }
                        # Server-Sent Events: no route timeout, long idle timeout.
                        - match: { path: "/obsideck/api/events" }
                          route:
                            cluster: obsideck
                            timeout: 0s
                            idle_timeout: 3600s
                        - match: { path_separated_prefix: "/obsideck" }
                          route:
                            cluster: obsideck
                            timeout: 60s
                            idle_timeout: 300s
                            retry_policy:
                              retry_on: connect-failure,reset-before-request
                              num_retries: 2
                    - name: reject
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 421
                            body: { inline_string: "Misdirected request\n" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: obsideck
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: obsideck
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: obsideck, port_value: 3000 }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options:
            idle_timeout: 60s
          explicit_http_config:
            http_protocol_options: {}
